# Compila FGIsraelView.exe en un servidor Windows de GitHub en cada push.
# Descarga: pestaña "Actions" del repositorio -> última ejecución verde -> "Artifacts" -> FGIsraelView-Windows
name: Build FGIsraelView.exe

on:
  push:
    branches: [main, futures-scope]
    tags: ["v*"]  # Etiqueta vX.Y.Z -> compila y publica el Release
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etiqueta del Release a publicar (ej. v3.0.0). Vacío = solo compilar."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Compilar núcleo C++ (fgcore)
        run: |
          pip install pybind11==3.1.0
          python setup_fgcore.py build_ext --inplace
          python -c "from engine.fgview import native; print(native.status()); assert native.AVAILABLE"
      - name: Pytest
        env:
          NEWS_FILTER_ENABLED: "false"
          CONTEXT_ENABLED: "false"
        run: pytest -q

  windows-exe:
    name: Compilar .exe (Windows)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias + PyInstaller
        run: pip install -r requirements.txt pyinstaller==6.22.3
      - name: Compilar núcleo C++ (fgcore, MSVC)
        continue-on-error: true  # Si fallara, la app usa la versión Python (mismos resultados)
        run: |
          pip install pybind11==3.1.0
          python setup_fgcore.py build_ext --inplace
          python -c "from engine.fgview import native; print(native.status())"
      - name: Verificar Tcl/Tk (ventana de arranque)
        shell: pwsh
        run: |
          python -c "import tkinter; t = tkinter.Tcl(); print('Tcl', t.eval('info patchlevel'), t.eval('info library'))"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Tcl no arranca con la configuración por defecto: se apunta a la carpeta tcl de Python"
            $tcl = Join-Path $env:pythonLocation "tcl\tcl8.6"
            $tk = Join-Path $env:pythonLocation "tcl\tk8.6"
            Get-ChildItem (Join-Path $env:pythonLocation "tcl") -ErrorAction SilentlyContinue | Select-Object Name
            "TCL_LIBRARY=$tcl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "TK_LIBRARY=$tk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $env:TCL_LIBRARY = $tcl
            $env:TK_LIBRARY = $tk
            python -c "import tkinter; t = tkinter.Tcl(); print('Tcl (reparado)', t.eval('info library'))"
            if ($LASTEXITCODE -ne 0) { Write-Error "Tcl/Tk no utilizable en este Python"; exit 1 }
          }
      - name: Compilar
        run: pyinstaller futures_scope.spec --noconfirm
      - name: Comprobar datos de Tcl/Tk empaquetados
        shell: pwsh
        run: |
          foreach ($d in "_tcl_data", "_tk_data") {
            $p = "dist\FGIsraelView\_internal\$d"
            if (-not (Test-Path $p)) { Write-Error "Falta $p en el paquete"; exit 1 }
            "{0}: {1} archivos" -f $d, (Get-ChildItem $p -Recurse -File).Count
          }
      - name: Autotest del ejecutable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\FGIsraelView\FGIsraelView.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "dist\FGIsraelView\data\selftest.txt" -ErrorAction SilentlyContinue
          Get-Content "dist\FGIsraelView\data\launcher.log" -Tail 40 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "El autotest del .exe falló"; exit 1 }
          # Entregamos la carpeta limpia (los datos y el .env se crean en el primer arranque del usuario)
          Remove-Item -Recurse -Force "dist\FGIsraelView\data", "dist\FGIsraelView\.env" -ErrorAction SilentlyContinue
      # Se sube la carpeta tal cual: GitHub la entrega en UN solo .zip con FGIsraelView/ dentro
      - uses: actions/upload-artifact@v4
        with:
          name: FGIsraelView-Windows
          path: dist/
          retention-days: 30

  macos-app:
    name: Compilar .app (macOS ${{ matrix.arch }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel  # Mac Intel (compatible desde Monterey 12)
            arch: intel
    runs-on: ${{ matrix.runner }}
    env:
      PY: .venv/bin/python
      MACOSX_DEPLOYMENT_TARGET: "12.0"  # Todo lo que se compile aquí debe arrancar desde Monterey
      # cryptography (dependencia de ccxt) ya no publica binario para Mac Intel en su última
      # versión; sin esto pip la compila enlazada a librerías de macOS 15. Se fuerza el binario oficial.
      PIP_ONLY_BINARY: "cryptography,cffi"
    steps:
      - uses: actions/checkout@v4
      # Python OFICIAL de python.org (universal2, compatible desde macOS 11): el Python de
      # GitHub en macOS 15 trae librerías que exigen macOS 15 y no arrancarían en Sonoma.
      - name: Instalar Python 3.11 oficial (python.org)
        run: |
          curl -sSLo py.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg py.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m venv .venv
          $PY -m pip install --upgrade pip
      # Homebrew del servidor trae OpenSSL compilada para macOS 15: se elimina ANTES de instalar
      # para que nada se enlace a ella (la app usará la del Python oficial, compatible con Sonoma).
      - name: Aislar OpenSSL de Homebrew
        run: |
          brew uninstall --ignore-dependencies --force openssl@3 openssl@1.1 2>/dev/null || true
          sudo rm -rf /usr/local/lib/ossl-modules /usr/local/lib/libcrypto* /usr/local/lib/libssl* /usr/local/opt/openssl* 2>/dev/null || true
      - name: Instalar dependencias + PyInstaller
        run: |
          # ccxt fija cryptography 50, que no tiene binario para Mac Intel: se instala ccxt sin
          # dependencias y se usa cryptography 48.0.1 (última con binario Intel, API compatible).
          grep -v '^ccxt' requirements.txt > req-mac.txt
          $PY -m pip install -r req-mac.txt pyinstaller==6.22.3 2>&1 | tee pip.log
          $PY -m pip install --no-deps ccxt==4.5.92
          $PY -m pip install "cryptography==48.0.1" typing_extensions aiohttp yarl orjson coincurve 2>&1 | tee -a pip.log
          $PY -c "import ccxt, cryptography; print('ccxt', ccxt.__version__, '· cryptography', cryptography.__version__)"
          echo "--- Paquetes compilados desde código fuente (si hay):"
          grep -iE "Building wheel for|Building wheels for" pip.log || echo "ninguno"
      - name: Compilar núcleo C++ (fgcore, clang, Intel, macOS 12)
        continue-on-error: true  # Si fallara, la app usa la versión Python (mismos resultados)
        env:
          ARCHFLAGS: "-arch x86_64"
        run: |
          $PY -m pip install pybind11==3.1.0
          $PY setup_fgcore.py build_ext --inplace
          $PY -c "from engine.fgview import native; print(native.status())"
      - name: Compatibilidad con macOS 12 Monterey (reinstala binarios demasiado nuevos)
        run: $PY tools/macos_compat.py 12.0
      - name: Verificar Tcl/Tk (ventana de arranque)
        run: $PY -c "import tkinter; t = tkinter.Tcl(); print('Tcl', t.eval('info patchlevel'), t.eval('info library'))"
      - name: Compilar
        run: $PY -m PyInstaller futures_scope.spec --noconfirm
      - name: Comprobar Tcl/Tk empaquetado y compatibilidad con Monterey (macOS 12)
        run: |
          APP=dist/FGIsraelView.app/Contents
          test -f $APP/Frameworks/_tcl_data/init.tcl || test -f $APP/Resources/_tcl_data/init.tcl || { echo "Falta _tcl_data"; exit 1; }
          test -f $APP/Frameworks/_tk_data/tk.tcl || test -f $APP/Resources/_tk_data/tk.tcl || { echo "Falta _tk_data"; exit 1; }
          echo "Tcl/Tk empaquetado OK"
          $PY - <<'PY'
          import pathlib, re, subprocess, sys
          MAGIC = {b"\xcf\xfa\xed\xfe", b"\xce\xfa\xed\xfe", b"\xca\xfe\xba\xbe", b"\xfe\xed\xfa\xcf"}
          worst, worst_file, count, bad = (0, 0), "", 0, []
          for p in pathlib.Path("dist/FGIsraelView.app").rglob("*"):
              if p.is_symlink() or not p.is_file():
                  continue
              with open(p, "rb") as fh:
                  if fh.read(4) not in MAGIC:
                      continue
              count += 1
              out = subprocess.run(["otool", "-l", str(p)], capture_output=True, text=True).stdout
              for block in out.split("Load command"):
                  if "cmd LC_BUILD_VERSION" in block:
                      m = re.search(r"^\s*minos (\d+)\.(\d+)", block, re.M)
                  elif "cmd LC_VERSION_MIN_MACOSX" in block:
                      m = re.search(r"^\s*version (\d+)\.(\d+)", block, re.M)
                  else:
                      continue
                  if m:
                      v = (int(m[1]), int(m[2]))
                      if v > (12, 0):
                          bad.append(f"{v[0]}.{v[1]} {p}")
                      if v > worst:
                          worst, worst_file = v, str(p)
          print(f"{count} binarios Mach-O · macOS mínimo requerido: {worst[0]}.{worst[1]} ({worst_file})")
          for b in bad[:20]:
              print("  exige más que Monterey:", b)
          if bad:
              print("--- Binarios que enlazan libcrypto/libssl:")
              for p in pathlib.Path("dist/FGIsraelView.app").rglob("*.so"):
                  deps = subprocess.run(["otool", "-L", str(p)], capture_output=True, text=True).stdout
                  hits = [l.strip() for l in deps.splitlines()[1:] if "libcrypto" in l or "libssl" in l]
                  if hits:
                      print(f"  {p.name}: {hits}")
          sys.exit(1 if bad else 0)
          PY
      - name: Autotest de la app
        run: |
          dist/FGIsraelView.app/Contents/MacOS/FGIsraelView --selftest
          cat "$HOME/Library/Application Support/FGView/data/selftest.txt" || true
      - name: Crear .dmg
        run: |
          mkdir dmg
          ditto dist/FGIsraelView.app dmg/FGIsraelView.app
          ln -s /Applications dmg/Aplicaciones
          for i in 1 2 3; do
            hdiutil create -volname "FG ISRAEL VIEW" -srcfolder dmg -ov -format UDZO "FGIsraelView-macOS-${{ matrix.arch }}.dmg" && break
            sleep 5
          done
          ls -lh *.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: FGIsraelView-macOS-${{ matrix.arch }}
          path: FGIsraelView-macOS-${{ matrix.arch }}.dmg
          retention-days: 30

  release:
    name: Publicar Release
    needs: [windows-exe, macos-app]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Preparar archivos
        run: |
          cd art/FGIsraelView-Windows && zip -qr ../../FGIsraelView-Build1-Windows.zip FGIsraelView && cd ../..
          cp art/FGIsraelView-macOS-intel/FGIsraelView-macOS-intel.dmg FGIsraelView-Build1-macOS-Intel.dmg
          ls -lh *.zip *.dmg
      - name: Crear Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'MD'
          ## FG ISRAEL VIEW · BUILD 1 · BY GUS X FER X ALFREDOBONUS

          Recomendador de scalping para futuros cripto (operaciones de 15–30 min), ahora con 10 módulos nuevos y rediseño.

          **Descargas**
          - **Windows**: `FGIsraelView-Build1-Windows.zip` → descomprime y abre `FGIsraelView\FGIsraelView.exe`
          - **Mac Intel (macOS 12 Monterey o superior)**: `FGIsraelView-Build1-macOS-Intel.dmg` → arrastra a Aplicaciones; la primera vez Control + clic → Abrir

          **Novedades v4.1**
          - 🌙 **Modo SWING / nocturno**: para dejar la operación abierta hasta 12 h. Tendencia de 4 h + 1 h, SL estructural, 3–5x máximo, liquidación lejísimos del SL y Time Machine de caminos de 8–12 h.
          - 🧊 **Anti-revancha**: 30 min sin volver a entrar en la misma cripto o dirección después de una pérdida.
          - 🔍 **Revisor de historial**: pega el texto del PDF de Binance o sube el CSV/Excel y te marca liquidaciones, operaciones sin SL, revanchas, horas sin protección y memecoins.
          - ⛔ **Sin SL no hay orden**: el Order Executor rechaza cualquier orden sin Stop Loss válido (antes de la liquidación).
          - 👥 **Long/Short Ratio de Binance** en el anti-squeeze: si hay muchísimas cuentas en corto, no se abre SHORT.
          - 💸 **Entradas post-only (maker 0.02%)** y 📈 **trailing stop** automático tras TP1.
          - 🧮 Simulación de papel paso a paso (respeta los movimientos de SL del escudo y del trailing).

          **Novedades Build 1**
          - 📊 La gráfica con la recomendación de operación (LONG/SHORT, entrada, SL, TPs) se muestra fija arriba en TODAS las páginas (v4.0.2).
          - ⚡ Time Machine mucho más rápido (v4.0.3): descarga del historial en paralelo, primer resultado inmediato con velas de 5 min, precarga automática en segundo plano y barra de progreso con tiempos.
          - 🛡️ Anti-squeeze (v4.0.4): detecta subidas/caídas bruscas que liquidan, aviso fijo en la gráfica, bloqueo de SHORT/LONG en riesgo alto, apalancamiento limitado al peor movimiento de 30 min de las últimas 24 h y alerta automática para posiciones abiertas.
          - 🔥 BURN OUT ya no bloquea (v4.0.4): siempre da la operación; si no es recomendable la marca ⚠️ con los motivos.
          - 🧲 Anti short squeeze 2.0 (v4.0.5): no recomienda SHORT después de una caída fuerte (agotamiento, RSI en sobreventa, fuera de Bollinger), zonas estimadas de liquidación de cortos y largos en la gráfica, y escudo automático que mueve el SL (break-even con ganancia, más cerca con pérdida; también en el exchange en modo real).
          - 🎓/🕎 Interruptor **PRINCIPIANTE GOY / EXPERTO RABBI**: explicaciones paso a paso o todo el detalle técnico.
          - 🧭 Rediseño: menú lateral por secciones (Operar, Escanear, Riesgo y capital, Contexto, Herramientas).
          - ⏳ **Time Machine**: 100,000 simulaciones Monte Carlo (bootstrap por bloques de 15–30 min, 90 días de velas de 1 min, solo tramos con volatilidad ±20% de la actual) → P(TP1/TP2/TP3/SL/tiempo), expectativa y VaR 95% con veredicto. Núcleo C++.
          - 📡 **Chart Scanner**: niveles A/B/C en 5m/15m/1h (cruce EMA 9/21, rupturas de 1h, rebote VWAP, divergencias RSI, picos de volumen, squeeze) → top 5 por puntuación, auto cada minuto.
          - 📰 **News Monitor**: calendario + noticias cripto + anuncios de exchanges con impacto y sentimiento; bloqueo ±30 min por impacto alto.
          - ⏱️ **Entry Timer**: cierre de vela de 5 min, sesiones de Londres/NY, aviso de funding y cancelación si el precio se aleja > 0.3 × ATR.
          - 🛡️ **Risk Manager**: stop diario, máximo 2 posiciones, bloqueo de posiciones correlacionadas y liquidación ≥ 3× el SL.
          - 💰 **Budget Manager**: saldo real, riesgo a la mitad tras drawdown del 10% y sugerencia de retiro del 20% cada +25%.
          - 🤖 **Order Executor** semiautomático: modo papel por defecto; real en Binance/Bybit solo con LIVE_TRADING_ENABLED=true, API key sin retiros y con lista de IPs (verificado con el exchange), margen aislado, SL y TPs reduce-only al entrar.
          - 🔔 **Alertas**: precio, cruce de EMAs, movimiento brusco y liquidación cerca por Telegram/webhook.
          - 💎 **Fundamentales cripto** (fees de DefiLlama, desbloqueos > 2%) y 🐋 **Smart Money** (Congreso de EE. UU. y ballenas) como contexto.
          - 🔥 **BURN OUT** (⛔ peligro extremo): bolsa de quema ≤ 5% del capital, 50–100x en BTC/ETH y 25–50x en nivel B, prohibido en memecoins, solo con P(TP1) ≥ 65% y señal ≥ 80, máximo 2 intentos al día, bloqueo de 7 días si llega a $0 y confirmación escribiendo CONFIRMO.

          _Herramienta educativa: solo ejecuta órdenes si tú confirmas (papel por defecto). No es asesoría financiera._
          MD
          TAG="${{ inputs.release_tag }}"; TAG="${TAG:-$GITHUB_REF_NAME}"
          gh release create "$TAG" FGIsraelView-Build1-Windows.zip FGIsraelView-Build1-macOS-Intel.dmg --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "FG ISRAEL VIEW Build 1 ($TAG)" --notes-file notes.md --latest
